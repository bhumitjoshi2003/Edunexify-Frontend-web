<div class="view-notification-container">
    <div class="notifications-card">
        <header class="notifications-header">
            <h2 class="title-text">🔔 Notifications</h2>
        </header>

        <section class="notifications-content">
            <div class="edu-page-skeleton edu-page-skeleton--content" *ngIf="isLoading" aria-busy="true" aria-label="Loading notifications">
    <div class="edu-sk-grid">
      <span class="edu-sk-shimmer edu-sk-card"></span><span class="edu-sk-shimmer edu-sk-card"></span>
      <span class="edu-sk-shimmer edu-sk-card"></span><span class="edu-sk-shimmer edu-sk-card"></span>
    </div>
    <div class="edu-sk-panel">
      <span class="edu-sk-shimmer edu-sk-line edu-sk-line-md"></span>
      <span class="edu-sk-shimmer edu-sk-table-line"></span><span class="edu-sk-shimmer edu-sk-table-line"></span><span class="edu-sk-shimmer edu-sk-table-line"></span>
    </div>
  </div>

            <div *ngIf="!isLoading && userNotifications.length === 0" class="empty-state">
                <div class="empty-icon">🔕</div>
                <p class="empty-message">You're all caught up! No new notifications.</p>
            </div>

            <div *ngIf="!isLoading && userNotifications.length > 0" class="notification-list-scroll-container">
                <ul class="notification-list">
                    <li *ngFor="let userNotif of userNotifications; trackBy: trackByNotificationId" [ngClass]="getNotificationClass(userNotif.isRead)">
                        <div class="notification-main-line">
                            <div class="notif-icon" [ngClass]="getTypeClass(userNotif.type)">{{
                                getTypeIcon(userNotif.type)
                                }}</div>
                            <span class="notification-date">{{ formatDate(userNotif.createdAt) }}</span>
                        </div>
                        <div class="notification-body-content">
                            <div class="notification-message">{{ userNotif.message }}</div>
                        </div>
                    </li>
                </ul>
            </div>
        </section>
    </div>
</div>
